services:
  app:
    build: .
    image: supermarket-front
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      POCKETBASE_URL: "https://pb.jccantos.com"
      POCKETBASE_EMAIL: "${POCKETBASE_EMAIL:?Requerida}"
      POCKETBASE_PASSWORD: "${POCKETBASE_PASSWORD:?Requerida}"
    restart: unless-stopped
